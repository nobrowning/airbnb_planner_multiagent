agents:
  adk_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset.8]
    mcp: [MCPToolset.8]
    params:
      name: finance_agent
      description: An agent that can help with stock market information, currency conversion, and financial data using Google
        Finance
      instruction: ['You are a specialized Finance assistant. Your primary function is to utilize the provided tools to search
          for stock information, convert currencies, analyze market data, and provide financial insights. You must rely exclusively
          on these tools for data and refrain from inventing information.', 'Key responsibilities:', '- Look up stock prices
          and company information', '- Convert currencies with real-time exchange rates', '- Provide market overviews and
          trends', '- Analyze historical stock data', '- Filter and compare financial instruments', '- Offer insights on price
          movements and market conditions', 'Ensure that all responses include the detailed output from the tools used and
          are formatted in Markdown. When providing financial information, include current prices, exchange rates, market
          trends, and relevant statistics. Always include disclaimers that this is not financial advice.']
      function: create_finance_agent
      instance: adk_agent
  adk_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    tools: [weather_mcp]
    mcp: [weather_mcp.0]
    params:
      name: weather_agent
      description: An agent that can help with weather questions
      instruction: [You are a specialized weather forecast assistant. Your primary function is to utilize the provided weather
          tools to retrieve forecast information for any location., '**CRITICAL DATE HANDLING INSTRUCTIONS:**', 'Today''s
          Date: {...} ({...})', 'When a user asks about weather for a SPECIFIC DATE:', 1. ALWAYS call get_forecast_by_city()
          or get_forecast() FIRST to get the complete 7-day forecast, '2. The tool will return ALL forecast periods with their
          day names (e.g., "Monday", "Monday Night", "Tuesday", etc.)', '3. After receiving the tool results, MATCH the requested
          date to the corresponding day name in the forecast', 4. EXTRACT and PRESENT the forecast period that matches the
          requested date, '**EXAMPLE WORKFLOW:**', 'User asks: "What''s the weather in Los Angeles on November 22, 2025?"',
        'Step 1: Calculate - November 22, 2025 is a Saturday', 'Step 2: Call get_forecast_by_city("Los Angeles", "CA")', 'Step
          3: Review ALL returned forecast periods', 'Step 4: Find the period named "Saturday" or "Saturday Night"', 'Step
          5: Present ONLY that specific period''s forecast to the user', '**KEY RULES:**', '- The forecast data contains up
          to 14 periods (7 days, each with day and night)', '- Period names are: Today, Tonight, Monday, Monday Night, Tuesday,
          Tuesday Night, etc.', '- ALWAYS retrieve the full forecast first, then extract the specific day', '- If the date
          is beyond the 7-day forecast window, inform the user', '- Include temperature, wind speed, wind direction, and detailed
          forecast in your response', '**RESPONSE FORMAT FOR DATE-SPECIFIC QUERIES:**', 'When answering a specific date query,
          structure your response as:', 1. Confirm the date and day of week, 2. Present the forecast for that specific day,
        '3. Include all details: temperature, wind, conditions, detailed description', 'Key responsibilities:', '- Use get_forecast_by_city()
          or get_forecast() to retrieve weather forecasts', '- Provide detailed weather information including temperature,
          wind, and conditions', '- Extract specific forecast periods (Today, Tonight, Tomorrow, or any day name, or date)
          from the tool results', '- When users ask about a specific date, ALWAYS call the tool first, then match the date
          to the day name in the results', '- Present weather information clearly with all relevant details from the tool
          output', Ensure that all responses include the detailed output from the tools used and are formatted clearly.]
      function: create_weather_agent
      instance: adk_agent
  adk_agent.2:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset.6]
    mcp: [MCPToolset.6]
    params:
      name: tripadvisor_agent
      description: An agent that can help with TripAdvisor searches for attractions, restaurants, and reviews
      instruction: ['You are a specialized TripAdvisor assistant. Your primary function is to utilize the provided tools to
          search for locations, attractions, restaurants, and reviews on TripAdvisor. You must rely exclusively on these tools
          for data and refrain from inventing information. Ensure that all responses include the detailed output from the
          tools used and are formatted in Markdown. When providing location information, include ratings, addresses, and other
          relevant details.']
      function: create_tripadvisor_agent
      instance: adk_agent
  adk_agent.3:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset]
    mcp: [MCPToolset.0]
    params:
      name: hotel_agent
      description: An agent that can help search for hotels, vacation rentals, and accommodations using Google Hotels
      instruction: ['You are a specialized Hotel and Accommodation assistant. Your primary function is to utilize the provided
          tools to search for hotels, vacation rentals, and other accommodations, compare prices, analyze amenities, and help
          users plan their stays. You must rely exclusively on these tools for data and refrain from inventing information.',
        'Key responsibilities:', '- Search for hotels and vacation rentals based on location and dates', '- Compare hotel
          prices, ratings, and amenities', '- Filter accommodations by price, rating, class, amenities, and property type',
        '- Get detailed property information including rooms, facilities, and policies', '- Analyze accommodation options
          for best value, location, and quality', '- Provide personalized recommendations based on user preferences', '- Help
          users make informed decisions about bookings', '- Offer accommodation planning advice and neighborhood insights',
        'Ensure that all responses include the detailed output from the tools used and are formatted in Markdown. When providing
          hotel information, include prices, ratings, amenities, location details, guest reviews, and cancellation policies.
          Help users understand the trade-offs between different accommodation options and provide context about neighborhoods
          and accessibility.']
      function: create_hotel_agent
      instance: adk_agent
  adk_agent.4:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset.4]
    mcp: [MCPToolset.4]
    params:
      name: flight_agent
      description: An agent that can help search for flights, compare prices, and plan air travel using Google Flights
      instruction: ['You are a specialized Flight booking assistant. Your primary function is to utilize the provided tools
          to search for flights, compare prices, analyze flight options, and help users plan their air travel. You must rely
          exclusively on these tools for data and refrain from inventing information.', 'Key responsibilities:', '- **Convert
          city names to Airport Codes BEFORE searching**: You must convert departure and arrival cities into their corresponding
          IATA airport codes.', '- Examples:', '- Beijing (北京) -> PEK (or PKX)', '- Los Angeles (洛杉矶) -> LAX', '- New York
          (纽约) -> JFK (or EWR, LGA)', '- Shanghai (上海) -> PVG (or SHA)', '- London (伦敦) -> LHR', '- Tokyo (东京) -> NRT (or
          HND)', '- Search for flights based on departure/arrival locations and dates using these codes.', '- Compare flight
          prices and durations', '- Filter flights by price, airline, and other criteria', '- Analyze flight options for best
          value, speed, and convenience', '- Provide detailed flight information including layovers, airlines, and schedules',
        '- Help users make informed decisions about flight bookings', '- Offer travel planning advice based on flight availability
          and pricing', 'Ensure that all responses include the detailed output from the tools used and are formatted in Markdown.
          When providing flight information, include prices, duration, airlines, layover details, departure/arrival times,
          and other relevant information. Help users understand the trade-offs between different flight options.']
      function: create_flight_agent
      instance: adk_agent
  adk_agent.5:
    type: instance
    models: [gemini-2.5-flash]
    tools: [MCPToolset.2]
    mcp: [MCPToolset.2]
    params:
      name: event_agent
      description: An agent that can help search for events, festivals, concerts, and other activities using Google Events
      instruction: ['You are a specialized Event assistant. Your primary function is to utilize the provided tools to search
          for events, concerts, festivals, art shows, networking events, and other activities. You must rely exclusively on
          these tools for data and refrain from inventing information.', 'Key responsibilities:', '- Search for events based
          on location, date, and event type', '- Filter and analyze events by various criteria (date, type, venue)', '- Provide
          detailed event information including venue, tickets, and timing', '- Help users discover interesting events based
          on their interests', '- Compare and recommend events based on user preferences', 'Ensure that all responses include
          the detailed output from the tools used and are formatted in Markdown. When providing event information, include
          titles, dates, venues, ticket information, and other relevant details.']
      function: create_event_agent
      instance: adk_agent
  agent.create_agent.0:
    type: factory
    models: [gemini-2.5-flash]
    tools: [send_message]
    params:
      name: SubAgentCaller
      instruction: self.root_instruction
      before_model_callback: self.before_model_callback
      description: Calls remote sub-agents to execute tasks based on discovered agents
      output_key: results
      function: create_agent
      instance: agent.create_agent
  agent.create_agent.1:
    type: factory
    models: [gemini-2.5-flash]
    tools: [search_agents]
    params:
      name: SubAgentSearcher
      instruction: self.root_instruction
      description: Analyzes plan and searches for appropriate sub-agents from registry
      output_key: agent_search_results
      function: create_agent
      instance: agent.create_agent
  agent.create_agent.2:
    type: factory
    models: [gemini-2.5-flash]
    tools: [send_message]
    params:
      name: Routing_agent
      instruction: self.root_instruction
      before_model_callback: self.before_model_callback
      description: This Routing agent orchestrates the decomposition of the user asking for weather forecast, airbnb accommodation,
        or tripadvisor searches
      output_key: results
      function: create_agent
      instance: agent.create_agent
  agent.OrchestratorAgent.orchestrator:
    type: class
    params:
      name: Orchestrator
      class: OrchestratorAgent
      sub_agents: [self.planner, self.searcher, self.caller, self.summarizer]
  agent.OrchestratorAgent.planner:
    type: class
    models: [gemini-2.5-flash]
    params:
      name: PlanActions
      instruction: ''
      output_key: plan
      class: OrchestratorAgent
  agent.OrchestratorAgent.summarizer:
    type: class
    models: [gemini-2.5-flash]
    params:
      name: ResultSummarizer
      instruction: ''
      class: OrchestratorAgent

models:
  gemini-2.5-flash:
    type: function
    agents: [adk_agent.3, adk_agent.5, adk_agent.1, agent.create_agent.0, agent.create_agent.1, adk_agent.4, adk_agent.2,
      agent.OrchestratorAgent.planner, agent.OrchestratorAgent.summarizer, adk_agent.0, agent.create_agent.2]
    params:
      wrapper: LiteLlm
      model: gemini-2.5-flash

tools:
  MCPToolset:
    type: mcp
    agents: [adk_agent.3]
    params:
      class: MCPToolset
      mcp_server: MCPToolset
  MCPToolset.2:
    type: mcp
    agents: [adk_agent.5]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.2
  MCPToolset.4:
    type: mcp
    agents: [adk_agent.4]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.4
  MCPToolset.6:
