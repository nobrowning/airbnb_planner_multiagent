    params:
      class: MCPToolset
      mcp_server: MCPToolset.6
  MCPToolset.8:
    type: mcp
    agents: [adk_agent.0]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.8
  search_agents:
    type: function
    agents: [agent.create_agent.1]
    params:
      module: self.search_agents
      description: "Search for appropriate agents from registry based on keyword and task.\n\nArgs:\n    keyword: Search keyword\
        \ (weather, accommodations, tripadvisor, location, transport)\n    task: Task description to help registry find best\
        \ match\n    topk: Number of top matching agents to return\n    tool_context: ADK tool context for state management\n\
        \    \nReturns:\n    Structured agent information including names, URLs, and agent cards"
  send_message:
    type: function
    agents: [agent.create_agent.0, agent.create_agent.2]
    params:
      module: self.send_message
      description: Send task to dynamically discovered agents using queue-based structured output.
  weather_mcp:
    type: mcp
    agents: [adk_agent.1]
    params:
      class: MCPToolset
      mcp_server: weather_mcp

