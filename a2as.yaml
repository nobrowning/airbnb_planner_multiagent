      returns: str
  search_agents:
    type: async
    module: host_agent.sub_agent_searcher
    args: [self, keyword, task, topk, tool_context]
    params:
      returns: dict
  send_message:
    type: async
    module: host_agent.remote_agent_connection
    args: [self, message_request]
    params:
      returns: SendMessageResponse
  send_message_to_agent:
    type: async
    module: host_agent.routing_agent
    args: [self, keyword, task, tool_context, top_k]
    params:
      returns: Optional[Task]

variables:
  APP_URL:
    type: env
    params:
      caller: [os.environ.get]
      path: [finance_agent.__main__, weather_agent.__main__, tripadvisor_agent.__main__, hotel_agent.__main__, flight_agent.__main__,
        event_agent.__main__]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [finance_agent.__main__, weather_agent.__main__, tripadvisor_agent.__main__, hotel_agent.__main__, flight_agent.__main__,
        event_agent.__main__]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [finance_agent.__main__, weather_agent.__main__, tripadvisor_agent.__main__, hotel_agent.__main__, flight_agent.__main__,
        event_agent.__main__]
  LITELLM_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [hotel_agent.hotel_agent, event_agent.event_agent, weather_agent.weather_agent, flight_agent.flight_agent, tripadvisor_agent.tripadvisor_agent,
        finance_agent.finance_agent]
  REGISTRY_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [host_agent.registry_client]
  REGISTRY_BASE_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [host_agent.routing_agent, host_agent.sub_agent_searcher, host_agent.host_router]

files:
  CURRENT_DIR:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  main.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [base_dir, hotel_server, main.py]
  server.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [base_dir, tripadvisor_agent, server.py]

processes:
  python:
    type: mcp
    actions: [exec]
    args: [[./weather_mcp.py]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]
